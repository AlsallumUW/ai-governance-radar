name: Suggest an update
description: Tell us about a new AI-governance document, a correction, a status change or a broken link. Every suggestion is checked against official sources before anything is added.
title: "[Update] "
labels: ["update-request"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are checked against official sources before anything is added. Please link the official source: the document itself, or the issuing body's own page that carries it. News articles, aggregators and social media posts cannot be used as sources.
  - type: input
    id: country
    attributes:
      label: Country or body
      description: Country name or ISO3 code (e.g. SAU), or a regional body code (e.g. GCC).
    validations:
      required: true
  - type: dropdown
    id: change_type
    attributes:
      label: What is new or wrong?
      options:
        - New instrument
        - Correction
        - Status change
        - Broken link
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Official source URL
      description: The official document or the issuer's own page.
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What should change, and where on the site (instrument title or page).
    validations:
      required: false
