name: Weekly link check
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 07:17 Riyadh
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/check_links.py
      - run: python3 scripts/log_changes.py --base HEAD
      - name: Open pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "No link changes"; exit 0; fi
          B="links/$(date +%F)"
          git config user.name "aigr-bot"; git config user.email "aigr-bot@users.noreply.github.com"
          git checkout -b "$B" && git commit -am "Link check $(date +%F)" && git push -u origin "$B"
          gh pr create --title "Link check $(date +%F)" --body "Automated weekly link check. Review status changes in the Changes tab of each country, then merge."
