name: Check update
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate data
        run: python3 scripts/validate.py
      - name: Changes in this PR
        run: python3 scripts/log_changes.py --base origin/main --dry-run
      - name: Build site
        run: python3 scripts/build.py
