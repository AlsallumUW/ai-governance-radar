name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Build and deploy are separate jobs (GitHub's recommended Pages pattern). In one job, deploy-pages
  # sometimes asks for the artifact within a second of upload and gets "Found 0 artifact(s)"
  # (24 Nov 2026: three failures in a row). A separate job only starts after the upload is registered.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/validate.py
      - run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the artifact to be listed
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000  # the action's maximum; Pages sometimes sits in updating_pages for several minutes
